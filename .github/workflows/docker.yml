name: docker

# Build and push GHCR images on GitHub Release (same event as PyPI + Zenodo).
# Tags:
#   ghcr.io/mskgreenbaumlab/vaxtract:<version>        full (Claude + compat)
#   ghcr.io/mskgreenbaumlab/vaxtract:latest
#   ghcr.io/mskgreenbaumlab/vaxtract:<version>-compat slim (no Claude CLI)
#   ghcr.io/mskgreenbaumlab/vaxtract:compat

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/mskgreenbaumlab/vaxtract

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push full image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.tag }}
            ${{ env.IMAGE }}:latest

      - name: Build and push compat image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: compat
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.tag }}-compat
            ${{ env.IMAGE }}:compat
